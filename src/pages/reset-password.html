        body { background-color: #FFFFFD; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;

            filter: drop-shadow(0 12px 32px rgba(45, 47, 46, 0.06));
        }

    body {
      min-height: max(884px, 100dvh);
    }

<body class="font-body text-on-surface antialiased selection:bg-primary-container">
<!-- Top AppBar (From Shared Components JSON Mapping) -->
<header class="w-full top-0 bg-[#FFFFFD] flex items-center justify-between px-6 py-4 z-50">
<div class="flex items-center gap-4">
<button class="flex items-center justify-center p-2 rounded-full hover:bg-[#F0F1EF] transition-colors active:scale-95 duration-200 text-[#5D5C4D]">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-manrope font-bold tracking-tight text-lg font-bold text-[#006947]">Lifetime Labs</h1>
</div>
<div class="w-10 h-10 rounded-full bg-surface-container-low flex items-center justify-center">
<!-- Decorative circle to balance -->
</div>
</header>
<div class="bg-[#F0F1EF] h-[1px] w-full"></div>
<main class="min-h-[calc(100vh-73px)] flex flex-col items-center justify-center px-6 py-12 relative overflow-hidden">
<!-- Background Accent: Subtle Zen Circle -->
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-primary-container/10 rounded-full blur-[100px] -z-10"></div>
<!-- Reset Password Canvas -->
<div class="w-full max-w-md space-y-10">
<!-- Header Section -->
<div class="space-y-4 text-center">
<!-- Coreon Mascot Integrated (Soft Kawaii Influence) -->
<div class="relative inline-block mb-2">
<div class="w-24 h-24 bg-surface-container-lowest rounded-full flex items-center justify-center coreon-float border-2 border-primary-container/30">
<svg class="text-secondary" fill="none" height="60" viewbox="0 0 100 100" width="60" xmlns="http://www.w3.org/2000/svg">
<circle cx="50" cy="50" fill="white" r="40" stroke="currentColor" stroke-width="3"></circle>
<circle cx="35" cy="45" fill="currentColor" r="4"></circle>
<circle cx="65" cy="45" fill="currentColor" r="4"></circle>
<path d="M42 65C45 68 55 68 58 65" stroke="currentColor" stroke-linecap="round" stroke-width="3"></path>
</svg>
</div>
<!-- Coreon AI Insights Bubble (Glassmorphism) -->
<div class="absolute -right-12 -top-4 backdrop-blur-xl bg-surface-container-lowest/80 border border-outline-variant/15 p-3 rounded-xl shadow-sm max-w-[120px]">
<p class="text-[10px] leading-tight font-medium text-on-surface-variant">Security is your sanctuary.</p>
</div>
</div>
<h2 class="font-headline text-3xl font-extrabold tracking-tight text-on-surface">Reset Password</h2>
<p class="text-secondary text-base leading-relaxed max-w-[280px] mx-auto">Choose a new password for your lab account.</p>
</div>
<!-- Form Section -->
<form class="space-y-8">
<div class="space-y-6">
<!-- Field 1: New Password -->
<div class="space-y-2 group">
<label class="block font-label text-[10px] tracking-[5%] uppercase font-semibold text-secondary-dim px-1">New Password</label>
<div class="relative">
<input class="w-full bg-surface-container-low border-none rounded-xl px-4 py-4 focus:ring-2 focus:ring-primary-container transition-all placeholder:text-outline-variant/60" placeholder="••••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
<!-- Minimalist Validation Cue -->
<div class="flex items-center gap-2 px-1">
<div class="h-1 flex-1 rounded-full bg-primary-container"></div>
<div class="h-1 flex-1 rounded-full bg-primary-container"></div>
<div class="h-1 flex-1 rounded-full bg-surface-container-highest"></div>
<div class="h-1 flex-1 rounded-full bg-surface-container-highest"></div>
<span class="text-[10px] font-medium text-on-surface-variant ml-2">Moderate</span>
</div>
</div>
<!-- Field 2: Confirm New Password -->
<div class="space-y-2 group">
<label class="block font-label text-[10px] tracking-[5%] uppercase font-semibold text-secondary-dim px-1">Confirm New Password</label>
<div class="relative">
<input class="w-full bg-surface-container-low border-none rounded-xl px-4 py-4 focus:ring-2 focus:ring-primary-container transition-all placeholder:text-outline-variant/60" placeholder="••••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
<!-- Match Validation (Subtle) -->
<div class="flex items-center gap-1.5 px-1 pt-1 opacity-0 group-focus-within:opacity-100 transition-opacity">
<span class="material-symbols-outlined text-[14px] text-primary" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="text-[11px] font-medium text-primary">Passwords match</span>
</div>
</div>
</div>
<!-- Primary CTA: Update Password -->
<button class="w-full bg-gradient-to-br from-primary to-primary-dim text-on-primary font-headline font-bold py-5 rounded-full shadow-[0_12px_32px_rgba(0,105,71,0.15)] active:scale-95 transition-all duration-200 tracking-wide text-lg" type="submit">
                    Update Password
                </button>
</form>
<!-- Secondary Action -->
<div class="text-center pt-4">
<button class="text-secondary text-sm font-medium hover:text-primary transition-colors underline underline-offset-8 decoration-secondary/20 hover:decoration-primary/50">
                    Cancel and return to login
                </button>
</div>
</div>
</main>
<!-- Content Footer: Decorative Zen Element -->
<footer class="mt-auto py-8 text-center">
<div class="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-surface-container-low/50 backdrop-blur-sm border border-outline-variant/10">
<span class="w-1.5 h-1.5 rounded-full bg-primary animate-pulse"></span>
<span class="text-[10px] font-label tracking-widest uppercase text-secondary">Secured by Lifetime Cloud</span>
</div>
</footer>
<!-- Bottom Navigation suppressed as this is a transactional task-focused screen -->
</body></html>
