<!DOCTYPE html>
<html class="light" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Reset Contraseña | Lifetime Labs</title>

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Plus+Jakarta+Sans:wght@400;600&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1"
        rel="stylesheet" />

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        "primary": "#006947",
                        "primary-container": "#a0f7ca",
                        "secondary": "#5d5c4d",
                        "on-surface-variant": "#5a5c5b",
                        "surface-container-low": "#f0f1ef"
                    },
                    fontFamily: { "headline": ["Manrope"], "body": ["Plus Jakarta Sans"] }
                }
            }
        }
    </script>

    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        body {
            background-color: #FFFFFD;
            min-height: 100vh;
        }

        .bioluminescent-glow {
            background: linear-gradient(145deg, #006947 0%, #005c3d 100%);
            box-shadow: 0 12px 32px rgba(162, 249, 204, 0.3);
        }

        .coreon-float {
            filter: drop-shadow(0 12px 32px rgba(45, 47, 46, 0.06));
        }
    </style>
</head>

<body class="font-body text-[#2d2f2e] antialiased flex flex-col pt-4">

    <header
        class="w-full flex items-center justify-between px-6 py-4 sticky top-0 bg-[#FFFFFD]/80 backdrop-blur-md z-50">
        <div class="flex items-center gap-4">
            <button onclick="location.href='login.html'"
                class="p-2 rounded-full hover:bg-surface-container-low text-secondary material-symbols-outlined">arrow_back</button>
            <div class="flex flex-col">
                <span class="font-headline font-extrabold text-xl text-primary tracking-tight">Lifetime Labs</span>
                <span class="text-[9px] font-bold uppercase tracking-[0.15em] opacity-50">The lab for your
                    potential</span>
            </div>
        </div>
    </header>

    <main class="flex-grow flex flex-col items-center px-6 pt-10 pb-12 max-w-md mx-auto w-full space-y-10">

        <div class="relative flex flex-col items-center">
            <div class="absolute -top-6 -right-10 z-10">
                <div
                    class="bg-white p-4 rounded-2xl shadow-xl border border-gray-100 text-xs italic text-on-surface-variant max-w-[150px]">
                    "La seguridad es tu santuario."
                </div>
            </div>
            <div
                class="w-24 h-24 bg-surface-container-low rounded-full flex items-center justify-center p-4 coreon-float border-2 border-primary-container/30">
                <img src="/assets/Coreon.svg" class="w-full h-full object-contain" alt="Coreon Mascot" />
            </div>
        </div>

        <section class="w-full space-y-8">
            <div class="text-center">
                <h2 class="font-headline font-bold text-2xl">Reset Contraseña</h2>
                <p class="text-on-surface-variant text-sm px-4">Elige una nueva clave para tu cuenta de laboratorio.</p>
            </div>

            <form class="space-y-6" action="login.html">
                <div class="space-y-2">
                    <label class="text-[10px] font-bold uppercase tracking-widest text-secondary px-1 ml-1">Nueva
                        Contraseña</label>
                    <div class="relative">
                        <input type="password" placeholder="••••••••"
                            class="w-full px-6 py-4 bg-surface-container-low border-none rounded-2xl focus:ring-2 focus:ring-primary-container text-sm" />
                        <button type="button"
                            class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 material-symbols-outlined">visibility</button>
                    </div>
                    <div class="flex gap-1 px-1">
                        <div class="h-1 flex-1 bg-primary rounded-full"></div>
                        <div class="h-1 flex-1 bg-primary rounded-full"></div>
                        <div class="h-1 flex-1 bg-gray-200 rounded-full"></div>
                        <span class="text-[9px] font-bold uppercase text-on-surface-variant ml-2">Media</span>
                    </div>
                </div>

                <div class="space-y-2">
                    <label class="text-[10px] font-bold uppercase tracking-widest text-secondary px-1 ml-1">Confirmar
                        Contraseña</label>
                    <div class="relative">
                        <input type="password" placeholder="••••••••"
                            class="w-full px-6 py-4 bg-surface-container-low border-none rounded-2xl focus:ring-2 focus:ring-primary-container text-sm" />
                    </div>
                </div>

                <button type="submit"
                    class="w-full bg-primary text-primary-container font-headline font-extrabold py-5 rounded-full bioluminescent-glow transition-all active:scale-[0.98] text-lg mt-4">
                    Actualizar Contraseña
                </button>
            </form>

            <div class="text-center">
                <button onclick="location.href='login.html'"
                    class="text-secondary text-sm font-medium hover:text-primary transition-colors underline underline-offset-8 decoration-secondary/20">
                    Cancelar y volver al login
                </button>
            </div>
        </section>
    </main>

    <footer class="mt-auto py-8 flex justify-center opacity-40">
        <div
            class="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-surface-container-low/50 border border-gray-100">
            <span class="w-1.5 h-1.5 rounded-full bg-primary animate-pulse"></span>
            <span class="text-[9px] font-bold uppercase tracking-widest text-secondary">Secured by Lifetime Cloud
