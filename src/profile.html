<!DOCTYPE html>
<html class="light" lang="es">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Perfil y Armario | Lifetime Labs</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Plus+Jakarta+Sans:wght@400;600&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1"
        rel="stylesheet" />
    <link href="/css/unified-layout.css" rel="stylesheet" />

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        "primary": "#006947",
                        "primary-dim": "#005c3d",
                        "primary-container": "#a0f7ca",
                        "cluster-cientifico": "#007BFF",
                        "cluster-tecnico": "#FF851B",
                        "cluster-creativo": "#6F42C1",
                        "cluster-social": "#E83E8C",
                        "cluster-estrategico": "#FFC107",
                        "surface": "#FFFFFD",
                    },
                    fontFamily: { "headline": ["Manrope"], "body": ["Plus Jakarta Sans"] }
                }
            }
        }
    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        .active-tab {
            font-variation-settings: 'FILL' 1 !important;
            color: white !important;
        }

        body {
            background-color: #f8faf9;
        }

        /* Gradiente Bioluminiscente dinámico */
        .bioluminescent-glow {
            background: linear-gradient(135deg, #006947 0%, #005c3d 100%);
            box-shadow: 0 10px 25px -5px rgba(0, 105, 71, 0.4);
        }

        .coreon-glow {
            filter: drop-shadow(0 0 20px rgba(160, 247, 202, 0.6));
        }

        /* Estilo de tarjetas coloridas */
        .card-pop {
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .card-pop:hover {
            transform: translateY(-5px);
        }
    </style>
</head>

<body class="font-body text-[#2d2f2e] antialiased px-6">
    <main class="ll-main-shell max-w-2xl mx-auto space-y-8">

        <section class="text-center space-y-4 py-6">
            <div id="seneca-cabra-slot" class="relative w-48 h-48 mx-auto">
                <div
                    class="absolute inset-0 bg-primary-container/20 blur-3xl animate-pulse rounded-[0%_100%_100%_100%]">
                </div>
                <div class="relative z-10 w-full h-full bg-white flex items-center justify-center shadow-2xl border-4 border-white overflow-hidden 
                                rounded-[0%_100%_100%_100%] transition-transform duration-500 hover:rotate-[-5deg]">
                    <img src="assets/Coreon.svg" class="w-32 h-32 coreon-glow" alt="Coreon Base">
                </div>
            </div>
            <div>
                <h2 class="font-headline font-black text-4xl tracking-tight text-primary-dim">Tu Coreon</h2>
                <p id="profile-user-email" class="text-xs text-secondary font-bold uppercase tracking-[0.2em] opacity-60">INVITADO</p>
            </div>
        </section>

        <section class="grid grid-cols-2 gap-4">
            <div class="ll-card-base ll-card-glow bg-white p-6 rounded-[2rem] border-b-4 border-cluster-cientifico card-pop">
                <span class="text-[10px] font-black text-cluster-cientifico uppercase tracking-tighter">Evolución</span>
                <p class="font-black text-primary-dim text-3xl mt-1"><span id="profile-evolution-percent">0</span><span class="text-sm opacity-40">%</span></p>
            </div>
            <div class="ll-card-base ll-card-glow bg-white p-6 rounded-[2rem] border-b-4 border-cluster-tecnico card-pop">
                <span class="text-[10px] font-black text-cluster-tecnico uppercase tracking-tighter">Racha</span>
                <p class="font-black text-primary-dim text-3xl mt-1"><span id="profile-streak-days">0</span> <span
                        class="text-xs font-bold text-secondary opacity-40">DÍAS</span></p>
            </div>
        </section>

        <section class="ll-card-base bg-white rounded-[2.5rem] p-8 border border-gray-100 space-y-8">
            <div class="flex justify-between items-center">
                <h3 class="font-headline font-black text-2xl text-primary-dim">Tu Armario</h3>
                <span
                    class="text-[10px] font-black bg-primary-container text-primary px-4 py-1.5 rounded-full uppercase tracking-widest shadow-inner">12
                    / 12+ ITEMS</span>
            </div>

            <div class="grid grid-cols-3 gap-4">
                <div
                    class="aspect-square bg-cluster-creativo/10 rounded-3xl flex items-center justify-center border-2 border-cluster-creativo/30 relative cursor-pointer active:scale-90 transition-transform group">
                    <span
                        class="material-symbols-outlined text-cluster-creativo text-4xl group-hover:scale-110 transition-transform">palette</span>
                    <span class="absolute -top-1 -right-1 bg-white rounded-full p-1 shadow-sm">
                        <span class="material-symbols-outlined text-cluster-creativo text-xs"
                            style="font-variation-settings: 'FILL' 1;">check_circle</span>
                    </span>
                </div>
                <div
                    class="aspect-square bg-cluster-cientifico/10 rounded-3xl flex items-center justify-center border-2 border-cluster-cientifico/10 cursor-pointer hover:border-cluster-cientifico/40 active:scale-90 transition-transform">
                    <span class="material-symbols-outlined text-cluster-cientifico text-4xl">eyeglasses</span>
                </div>
                <div
                    class="aspect-square bg-cluster-social/10 rounded-3xl flex items-center justify-center border-2 border-cluster-social/10 cursor-pointer hover:border-cluster-social/40 active:scale-90 transition-transform">
                    <span class="material-symbols-outlined text-cluster-social text-4xl">favorite</span>
                </div>
                <div
                    class="aspect-square bg-gray-50 rounded-3xl flex items-center justify-center opacity-30 relative overflow-hidden">
                    <span class="material-symbols-outlined text-secondary text-3xl">lock</span>
                    <div class="absolute inset-0 bg-gradient-to-tr from-transparent via-white/20 to-transparent"></div>
                </div>
            </div>

            <button
                class="w-full bioluminescent-glow text-white font-black py-5 rounded-[1.5rem] shadow-2xl active:scale-95 transition-all text-sm uppercase tracking-[0.2em]">
                Equipar Accesorios
            </button>
        </section>

        <section class="ll-card-base bg-white rounded-[2.5rem] p-8 border border-gray-100 space-y-6">
            <h3 class="font-headline font-black text-xl text-primary-dim">Preferencias</h3>
            
            <div class="flex flex-col gap-2">
                <label for="language-select" class="text-xs font-bold text-secondary uppercase tracking-widest">Idioma de la IA</label>
                <select id="language-select" class="w-full bg-surface border border-gray-200 rounded-xl px-4 py-3 text-sm font-bold text-primary-dim focus:ring-2 focus:ring-primary focus:border-primary outline-none">
                    <option value="es">Español</option>
                    <option value="en">English</option>
                </select>
                <p class="text-[10px] text-muted leading-tight mt-1">Configura el lenguaje base en el que Coreon se comunicará contigo.</p>
            </div>
            
            <div class="pt-4 border-t border-gray-100 flex flex-col gap-3">
                <button id="btn-delete-account" class="w-full py-4 bg-red-50 text-red-600 font-black text-xs uppercase tracking-widest rounded-xl flex items-center justify-center gap-2 hover:bg-red-100 transition-colors">
                    <span class="material-symbols-outlined text-base">delete_forever</span>
                    Eliminar Mi Cuenta (Test)
                </button>
            </div>
        </section>

        <button id="btn-logout"
            class="w-full py-6 text-cluster-social font-black text-xs uppercase tracking-widest flex items-center justify-center gap-3 opacity-40 hover:opacity-100 transition-opacity">
            <span class="material-symbols-outlined text-lg">logout</span>
            Cerrar Sesión Segura
        </button>

    </main>
    <script type="module" src="js/pages/main-profile.js"></script>

</body>

</html>
