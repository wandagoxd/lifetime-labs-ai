<!DOCTYPE html>

<html class="light" lang="en">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>Laboratorio Diario - Lifetime Labs</title>
  <link rel="icon" type="image/png" href="/assets/website%20icon.png" />
  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;800&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap"

    rel="stylesheet" />
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
    rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

      darkMode: "class",
      theme: {
        extend: {
          "colors": {

            "primary-fixed": "#a0f7ca",
            "surface-container-low": "#f0f1ef",
            "tertiary": "#665a4b",
            "error": "#b31b25",
            "secondary-fixed": "#e5e3d0",
            "surface": "#f6f6f5",
            "on-error-container": "#570008",
            "surface-bright": "#f6f6f5",
            "tertiary-container": "#fdebd8",
            "on-secondary-fixed-variant": "#5d5c4d",
            "surface-container": "#e7e8e6",
            "on-primary-fixed-variant": "#006b48",
            "outline-variant": "#acadac",
            "on-surface": "#2d2f2e",
            "background": "#f6f6f5",
            "inverse-surface": "#0c0f0e",
            "on-tertiary-fixed": "#504437",
            "on-secondary": "#f6f3e0",
            "primary-fixed-dim": "#92e9bd",
            "surface-variant": "#dbdddb",
            "on-primary-fixed": "#004b31",
            "tertiary-fixed-dim": "#eeddcb",
            "surface-tint": "#006947",
            "on-primary": "#c9ffe0",
            "on-secondary-fixed": "#404032",
            "secondary": "#5d5c4d",
            "inverse-primary": "#a0f7ca",
            "outline": "#767776",
            "error-container": "#fb5151",
            "surface-container-highest": "#dbdddb",
            "surface-container-high": "#e1e3e1",
            "tertiary-dim": "#594e40",
            "on-background": "#2d2f2e",
            "primary": "#006947",
            "inverse-on-surface": "#9c9d9c",
            "on-primary-container": "#006040",
            "on-tertiary": "#fff0e2",
            "primary-dim": "#005c3d",
            "secondary-dim": "#515042",
            "on-tertiary-container": "#625648",
            "tertiary-fixed": "#fdebd8",
            "on-tertiary-fixed-variant": "#6d6152",
            "secondary-container": "#e5e3d0",
            "on-surface-variant": "#5a5c5b",
            "surface-container-lowest": "#ffffff",
            "on-error": "#ffefee",

            "xl": "1.5rem",
            "full": "9999px"
          },
          "fontFamily": {
            "headline": ["Manrope"],
            "body": ["Plus Jakarta Sans"],
            "label": ["Plus Jakarta Sans"]
          }
        },
      },

  <style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }

    .glass-bubble {
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .bioluminescent-glow {
      box-shadow: 0 0 20px 2px rgba(162, 249, 204, 0.4);
    }
  </style>
  <style>
    body {
      min-height: max(884px, 100dvh);
      padding-top: 5rem;
      /* Esto baja todo el contenido 80px */
      background-color: #f8faf9;
    }
  </style>
  <link href="/css/styles.css" rel="stylesheet" />
</head>

<body class="bg-background font-body text-on-surface min-h-screen flex flex-col" data-active-nav="labs" data-page="labs"
  data-root="../../" data-shell="app">
  <!-- TopAppBar -->
  <header
    class="fixed top-0 w-full z-50 bg-[#FFFFFD] dark:bg-stone-950 flex justify-between items-center px-6 h-16 w-full">
    <a class="flex items-center gap-2 cursor-pointer hover:opacity-80 transition-opacity" href="index.html">
      <img src="assets/website-icon-standing-up.png" class="w-6 h-6 object-contain" alt="Lifetime Labs Logo" />
      <span class="text-xl font-bold text-[#006947] dark:text-[#A2F9CC] font-manrope tracking-tight">Lifetime
        Labs</span>
    </a>
    <div class="flex gap-3">
      <button onclick=""
        class="p-2 rounded-full bg-surface-container-low text-secondary material-symbols-outlined">settings</button>
      <button onclick=""
        class="p-2 rounded-full bg-surface-container-low text-secondary material-symbols-outlined">notifications</button>
    </div>
  </header>
  <main class="max-w-3xl mx-auto space-y-16">

    <section id="system-monitor"
      class="bg-primary/5 border-2 border-primary/10 rounded-[2rem] p-6 flex items-center gap-6 relative overflow-hidden">
      <div class="absolute inset-0 opacity-5"
        style="background-image: radial-gradient(#006947 1px, transparent 1px); background-size: 20px 20px;"></div>

      <div
        class="relative w-20 h-20 bg-white rounded-2xl shadow-inner flex items-center justify-center shrink-0 border-2 border-primary-container">
        <img src="assets/Coreon.svg" class="w-12 h-12" alt="System Core">
      </div>

      <div class="space-y-1">
        <span class="text-[10px] font-black text-primary uppercase tracking-[0.3em]">System Status: Analyzing</span>
        <div id="coreon-feedback" class="text-primary-dim font-bold text-lg leading-tight">
          Esperando ingreso de datos para calibración de perfil...
        </div>
      </div>
    </section>

    <section id="app-container" class="relative min-h-[400px]">
    </section>

  </main>

  <nav
    class="fixed bottom-0 left-0 w-full h-24 bg-white/90 backdrop-blur-xl border-t border-gray-100 flex justify-around items-center px-6 z-50">
    <button onclick="location.href='index.html'"
      class="flex items-center justify-center w-12 h-12 text-[#acadac] hover:text-primary">
      <span class="material-symbols-outlined text-2xl">home</span>
    </button>
    <button onclick="location.href='career-bank.html'"
      class="flex items-center justify-center w-12 h-12 text-[#acadac] hover:text-primary">
      <span class="material-symbols-outlined text-2xl">auto_stories</span>
    </button>
    <button onclick="location.href='labs.html'"
      class="bg-[#006947] bioluminescent-glow text-white w-16 h-16 rounded-full -mt-12 border-[6px] border-[#f8faf9] flex items-center justify-center shadow-2xl transition-transform active:scale-90">
      <span class="material-symbols-outlined text-white text-3xl">science</span>
    </button>
    <button onclick="location.href='profile.html'"
      class="flex items-center justify-center w-12 h-12 text-[#acadac] hover:text-primary">
      <span class="material-symbols-outlined text-2xl"
        style="font-variation-settings: 'FILL' 1, 'wght' 700;">person</span>
    </button>
    <button onclick="location.href='why-us.html'"
      class="flex items-center justify-center w-12 h-12 text-[#acadac] hover:text-primary">
      <span class="material-symbols-outlined text-2xl">info</span>
    </button>
  </nav>
  <script type="module" src="js/pages/main-labs.js"></script>
</body>

</html>
