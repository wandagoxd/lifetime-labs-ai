<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Join the Lab | Lifetime Labs</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;800&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "tertiary": "#665a4b",
                    "on-error": "#ffefee",
                    "on-tertiary": "#fff0e2",
                    "surface-dim": "#d3d5d3",
                    "on-secondary": "#f6f3e0",
                    "secondary-container": "#e5e3d0",
                    "on-primary-fixed": "#004b31",
                    "primary-fixed-dim": "#92e9bd",
                    "primary": "#006947",
                    "secondary-fixed": "#e5e3d0",
                    "error-dim": "#9f0519",
                    "on-secondary-fixed": "#404032",
                    "on-primary-fixed-variant": "#006b48",
                    "tertiary-fixed": "#fdebd8",
                    "surface-container": "#e7e8e6",
                    "surface-container-high": "#e1e3e1",
                    "surface-container-highest": "#dbdddb",
                    "on-surface": "#2d2f2e",
                    "surface-container-low": "#f0f1ef",
                    "surface-container-lowest": "#ffffff",
                    "primary-container": "#a0f7ca",
                    "surface-tint": "#006947",
                    "outline-variant": "#acadac",
                    "tertiary-dim": "#594e40",
                    "on-primary": "#c9ffe0",
                    "error-container": "#fb5151",
                    "background": "#f6f6f5",
                    "on-background": "#2d2f2e",
                    "secondary-dim": "#515042",
                    "surface-variant": "#dbdddb",
                    "secondary": "#5d5c4d",
                    "inverse-primary": "#a0f7ca",
                    "outline": "#767776",
                    "on-secondary-fixed-variant": "#5d5c4d",
                    "tertiary-container": "#fdebd8",
                    "primary-fixed": "#a0f7ca",
                    "tertiary-fixed-dim": "#eeddcb",
                    "secondary-fixed-dim": "#d7d5c2",
                    "surface": "#f6f6f5",
                    "on-tertiary-container": "#625648",
                    "surface-bright": "#f6f6f5",
                    "error": "#b31b25",
                    "on-surface-variant": "#5a5c5b",
                    "on-error-container": "#570008",
                    "on-tertiary-fixed": "#504437",
                    "on-primary-container": "#006040",
                    "primary-dim": "#005c3d",
                    "on-secondary-container": "#535244",
                    "on-tertiary-fixed-variant": "#6d6152",

            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "1.5rem",
                    "full": "9999px"
            },
            "fontFamily": {
                    "headline": ["Manrope"],
                    "body": ["Plus Jakarta Sans"],
                    "label": ["Plus Jakarta Sans"]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            background-color: #FFFFFD;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .hero-headline {
            font-family: 'Manrope', sans-serif;
            letter-spacing: -0.02em;
        }
        .coreon-bubble {
            backdrop-filter: blur(12px);
            background: rgba(255, 255, 255, 0.8);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
<link href="../styles.css" rel="stylesheet"/>
<script defer="" src="../script.js"></script>
  </head>
<body class="text-on-background min-h-screen flex flex-col overflow-x-hidden" data-page="signup" data-root="../../" data-shell="focused">
<!-- Top Navigation Bar (Simplified for focused journey) -->
<header class="w-full top-0 sticky z-50 bg-[#FFFFFD] flex items-center justify-between px-6 py-4">
<div class="flex items-center gap-2">
<span class="text-xl font-bold tracking-tight text-[#006947] hero-headline">Lifetime Labs</span>
</div>
<button class="p-2 rounded-full hover:bg-surface-container-low transition-colors" data-route="whyUs">
<span class="material-symbols-outlined text-secondary">close</span>
</button>
</header>
<main class="flex-grow flex flex-col items-center justify-start px-6 pt-8 pb-12 max-w-md mx-auto w-full">
<!-- Mascot Section (Coreon) -->
<div class="relative w-full mb-10 flex flex-col items-center">
<div class="absolute -top-4 -right-2">
<div class="coreon-bubble p-4 rounded-xl shadow-[0_12px_32px_rgba(45,47,46,0.06)] border border-white/50 text-sm text-on-surface-variant max-w-[180px]">
                    "Every great discovery starts with a single curiosity."
                </div>
</div>
<div class="w-32 h-32 bg-surface-container-low rounded-full flex items-center justify-center relative overflow-hidden">
<img class="w-24 h-24 object-contain" data-alt="Minimalist cute mascot Coreon with simple dot eyes and a soft smile peaking from behind a laboratory beaker" src="../assets/Coreon.svg"/>
</div>
</div>
<!-- Headline & Sub-headline -->
<div class="text-center mb-10">
<h1 class="hero-headline text-3xl font-extrabold text-primary leading-tight mb-3">Join the Lab</h1>
<p class="text-secondary font-body text-lg">Tell us what excites you</p>
</div>
<!-- Interest Tags Bento Grid -->
<div class="w-full mb-12">
<div class="grid grid-cols-2 gap-3">
<button class="flex items-center justify-center gap-2 py-4 px-4 bg-secondary-container rounded-xl text-on-secondary-fixed-variant font-medium transition-all active:scale-95 border-2 border-transparent focus:border-primary-container">
<span class="material-symbols-outlined text-lg">science</span>
<span class="text-sm">Science</span>
</button>
<button class="flex items-center justify-center gap-2 py-4 px-4 bg-secondary-container rounded-xl text-on-secondary-fixed-variant font-medium transition-all active:scale-95 border-2 border-transparent focus:border-primary-container">
<span class="material-symbols-outlined text-lg">palette</span>
<span class="text-sm">Arts</span>
</button>
<button class="flex items-center justify-center gap-2 py-4 px-4 bg-primary-container text-on-primary-container rounded-xl font-semibold shadow-sm transition-all active:scale-95 border-2 border-primary">
<span class="material-symbols-outlined text-lg" style="font-variation-settings: 'FILL' 1;">biotech</span>
<span class="text-sm">Tech</span>
</button>
<button class="flex items-center justify-center gap-2 py-4 px-4 bg-secondary-container rounded-xl text-on-secondary-fixed-variant font-medium transition-all active:scale-95 border-2 border-transparent focus:border-primary-container">
<span class="material-symbols-outlined text-lg">group</span>
<span class="text-sm">Social</span>
</button>
<button class="flex items-center justify-center gap-2 py-4 px-4 bg-secondary-container rounded-xl text-on-secondary-fixed-variant font-medium transition-all active:scale-95 border-2 border-transparent focus:border-primary-container col-span-2">
<span class="material-symbols-outlined text-lg">forest</span>
<span class="text-sm">Nature</span>
</button>
<button class="flex items-center justify-center gap-2 py-4 px-4 bg-secondary-container rounded-xl text-on-secondary-fixed-variant font-medium transition-all active:scale-95 border-2 border-transparent focus:border-primary-container">
<span class="material-symbols-outlined text-lg">history_edu</span>
<span class="text-sm">Philosophy</span>
</button>
<button class="flex items-center justify-center gap-2 py-4 px-4 bg-secondary-container rounded-xl text-on-secondary-fixed-variant font-medium transition-all active:scale-95 border-2 border-transparent focus:border-primary-container">
<span class="material-symbols-outlined text-lg">fitness_center</span>
<span class="text-sm">Wellness</span>
</button>
</div>
</div>
<!-- Form Section -->
<div class="w-full space-y-6">
<div class="space-y-4">
<div class="relative">
<label class="block text-[10px] tracking-[0.05em] uppercase text-secondary font-label font-bold mb-1 ml-1">Email Address</label>
<input class="w-full px-6 py-4 bg-surface-container-low border-none rounded-xl focus:ring-2 focus:ring-primary-container text-on-surface placeholder:text-outline text-sm" placeholder="explorer@lifetimelabs.io" type="email"/>
</div>
<div class="relative">
<label class="block text-[10px] tracking-[0.05em] uppercase text-secondary font-label font-bold mb-1 ml-1">Password</label>
<input class="w-full px-6 py-4 bg-surface-container-low border-none rounded-xl focus:ring-2 focus:ring-primary-container text-on-surface placeholder:text-outline text-sm" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Primary Action -->
<button class="w-full bg-[#A2F9CC] text-[#006947] font-bold py-5 rounded-full shadow-[0_12px_32px_rgba(162,249,204,0.3)] hover:shadow-[0_16px_48px_rgba(162,249,204,0.4)] transition-all active:scale-[0.98] text-lg flex items-center justify-center gap-2 mt-8" data-route="home">
                Create Account
                <span class="material-symbols-outlined">arrow_forward</span>
</button>
<p class="text-center text-xs text-on-surface-variant leading-relaxed px-4">
                By creating an account, you agree to our 
                <a class="text-primary font-semibold underline underline-offset-4 decoration-primary-container" data-route="whyUs" href="#">Terms of Discovery</a> 
                and Privacy Policy.
            </p>
</div>
</main>
<!-- Decorative Bottom Gradient -->
<div class="fixed bottom-0 left-0 w-full h-24 bg-gradient-to-t from-[#FFFFFD] to-transparent pointer-events-none"></div>
<!-- Footer for Onboarding (Focused) -->
<footer class="w-full py-8 px-6 text-center">
<p class="text-secondary text-sm">
            Already have an account? 
            <a class="text-primary font-bold ml-1" data-route="login" href="#">Log in</a>
</p>
</footer>
</body></html>
