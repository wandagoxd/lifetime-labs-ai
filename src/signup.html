<!DOCTYPE html>
<html class="light" lang="es">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>Join the Lab | Lifetime Labs</title>

  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Plus+Jakarta+Sans:wght@400;600&display=swap"
    rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1"
    rel="stylesheet" />

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            "primary": "#006947",
            "primary-container": "#a0f7ca",
            "secondary": "#5d5c4d",
            "on-surface-variant": "#5a5c5b",
            "surface-container-low": "#f0f1ef"
          },
          fontFamily: { "headline": ["Manrope"], "body": ["Plus Jakarta Sans"] }
        }
      }
    }
  </script>

  <style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }

    body {
      background-color: #FFFFFD;
      min-height: 100vh;
    }

    .bioluminescent-glow {
      background: linear-gradient(145deg, #006947 0%, #005c3d 100%);
      box-shadow: 0 12px 32px rgba(162, 249, 204, 0.3);
    }
  </style>
</head>

<body class="font-body text-on-background flex flex-col pt-4">

  <header class="w-full flex items-center justify-between px-6 py-4 sticky top-0 bg-[#FFFFFD]/80 backdrop-blur-md z-50">
    <div class="flex flex-col">
      <span class="font-headline font-extrabold text-xl text-primary tracking-tight">Lifetime Labs</span>
      <span class="text-[9px] font-bold uppercase tracking-[0.15em] opacity-50">The lab for your potential</span>
    </div>
    <button onclick="location.href='index.html'"
      class="p-2 rounded-full bg-surface-container-low text-secondary material-symbols-outlined">close</button>
  </header>

  <main class="flex-grow flex flex-col items-center px-6 pt-10 pb-12 max-w-md mx-auto w-full space-y-10">

    <div class="relative flex flex-col items-center">
      <div class="absolute -top-6 -right-8 z-10">
        <div
          class="bg-white p-4 rounded-2xl shadow-xl border border-gray-100 text-xs italic text-on-surface-variant max-w-[160px]">
          "Toda gran descubrimiento nace de una curiosidad."
        </div>
      </div>
      <div class="w-32 h-32 bg-surface-container-low rounded-full flex items-center justify-center p-4">
        <img src="/assets/Coreon.svg" class="w-24 h-24 object-contain" alt="Coreon Mascot" />
      </div>
    </div>

    <section class="w-full space-y-8">
      <div class="text-center">
        <h2 class="font-headline font-bold text-2xl">Únete al Laboratorio</h2>
        <p class="text-on-surface-variant text-sm">Comienza tu viaje basado en evidencia.</p>
      </div>

      <!-- Mensaje de error -->
      <div id="error-msg" style="display: none; background: #fef2f2; border: 1px solid #fecaca; color: #dc2626; border-radius: 1rem; padding: 0.75rem 1rem; font-size: 0.8rem; font-weight: 600; text-align: center;"></div>

      <form class="space-y-4" id="signup-form">
        <div class="space-y-2">
          <label class="text-[10px] font-bold uppercase tracking-widest text-secondary px-1 ml-1">Email</label>
          <input id="input-email" type="email" placeholder="explorador@lifetimelabs.io"
            class="w-full px-6 py-4 bg-surface-container-low border-none rounded-2xl focus:ring-2 focus:ring-primary-container text-sm" />
        </div>

        <div class="space-y-2">
          <label class="text-[10px] font-bold uppercase tracking-widest text-secondary px-1 ml-1">Contraseña</label>
          <input id="input-password" type="password" placeholder="••••••••"
            class="w-full px-6 py-4 bg-surface-container-low border-none rounded-2xl focus:ring-2 focus:ring-primary-container text-sm" />
        </div>

        <button type="submit" id="btn-signup"
          class="w-full bg-primary text-primary-container font-headline font-extrabold py-5 rounded-full bioluminescent-glow transition-all active:scale-[0.98] text-lg flex items-center justify-center gap-2 mt-6">
          <span class="btn-label">Crear Cuenta</span>
          <span class="material-symbols-outlined">arrow_forward</span>
        </button>
      </form>

      <!-- OAuth + registro -->
      <footer class="text-center space-y-6">
        <div class="flex items-center gap-4 text-[10px] font-bold uppercase text-gray-300">
          <div class="h-px flex-1 bg-gray-100"></div>
          <span>O continúa con</span>
          <div class="h-px flex-1 bg-gray-100"></div>
        </div>

        <div class="grid grid-cols-1 gap-4">
          <button id="btn-google" type="button"
            class="flex items-center justify-center gap-2 py-3 bg-white border border-gray-100 rounded-2xl text-sm font-semibold shadow-sm active:scale-95 transition-transform">
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
              <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
              <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
              <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
            </svg>
            <span>Google</span>
          </button>
        </div>
      </footer>

      <p class="text-center text-[10px] text-on-surface-variant leading-relaxed px-6 opacity-60">
        Al crear tu cuenta, aceptas nuestros
        <a href="#" class="font-bold underline decoration-primary-container">Términos de Descubrimiento</a>
        y Política de Privacidad.
      </p>
    </section>
  </main>

  <footer class="w-full py-8 text-center border-t border-gray-50">
    <p class="text-secondary text-sm">
      ¿Ya tienes una cuenta?
      <a href="login.html" class="text-primary font-bold ml-1 hover:underline">Inicia sesión</a>
    </p>
  </footer>

  <script type="module" src="js/pages/signup.js"></script>
</body>

</html>
