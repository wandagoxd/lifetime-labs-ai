<!DOCTYPE html>
<html class="light" lang="es">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>Lifetime Labs | Inicio</title>

  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Plus+Jakarta+Sans:wght@400;600&display=swap"
    rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1"
    rel="stylesheet" />

  <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            "primary": "#006947",
            "primary-dim": "#005c3d",
            "cluster-cientifico": "#007BFF",
            "cluster-tecnico": "#FF851B",
            "cluster-creativo": "#6F42C1",
            "on-surface": "#2d2f2e",
          },
          fontFamily: { "headline": ["Manrope"], "body": ["Plus Jakarta Sans"] }
        }
      }
    }
  </script>

  <style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }

    .bioluminescent-glow {
      background: linear-gradient(135deg, #006947 0%, #005c3d 100%);
      box-shadow: 0 10px 25px -5px rgba(0, 105, 71, 0.4);
    }

    body {
      background-color: #f8faf9;
    }

    /* Animación de Pulso Suave para el Widget de Bienvenida */
    .pulse-vibrant {
      animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
        transform: scale(1);
      }

      50% {
        opacity: 0.9;
        transform: scale(1.02);
      }
    }
  </style>
</head>

<body class="font-body text-on-surface antialiased pt-20 pb-36 px-6">

  <header
    class="fixed top-0 left-0 w-full h-16 z-50 bg-white/90 backdrop-blur-md flex justify-between items-center px-6 border-b border-primary/10">
    <div class="flex items-center gap-2">
      <img src="assets/website-icon-standing-up.png" class="w-6 h-6" alt="Logo" />
      <h1 class="font-headline font-black text-lg text-primary tracking-tight">Hogar</h1>
    </div>
    <div class="flex gap-2">
      <button class="material-symbols-outlined text-[#2d2f2e]/60 p-2 bg-gray-50 rounded-full">settings</button>
      <button class="material-symbols-outlined text-[#2d2f2e]/60 p-2 bg-gray-50 rounded-full">notifications</button>
    </div>
  </header>

  <main class="max-w-2xl mx-auto space-y-10">

    <section class="flex justify-between items-end py-4">
      <div class="space-y-2">
        <div
          class="inline-flex bg-cluster-creativo text-white px-3 py-1 rounded-full shadow-xl shadow-cluster-creativo/20 pulse-vibrant">
          <span class="text-[9px] font-black uppercase tracking-[0.1em]">Fase Beta: Colombia</span>
        </div>
        <h2 class="font-headline font-black text-4xl text-primary-dim leading-tight">¡Hola de nuevo,<br><span
            class="text-primary">Coreon {Nombre}!</span></h2>
      </div>
      <div class="relative w-24 h-24 cursor-pointer hover:scale-105 transition-transform"
        onclick="location.href='profile.html'">
        <div
          class="w-full h-full bg-white rounded-[0%_100%_100%_100%] border-4 border-white shadow-xl overflow-hidden flex items-center justify-center relative coreon-container">
          <img src="assets/Coreon.svg" class="w-16 h-16" alt="Coreon Base">
          <span
            class="material-symbols-outlined absolute text-xl text-cluster-cientifico pointer-events-none top-1/2 left-2/3-translate-x-10-translate-y-1/2 mt-[1px] hover:rotate-6 transition-transform"
            style="font-variation-settings: 'wght' 100; color: #48752C;">emoji_objects</span>
        </div>
      </div>
    </section>

    <section class="mb-12">
      <div class="grid grid-cols-2 gap-4">
        <div
          class="col-span-2 bg-white rounded-[2.5rem] p-8 relative overflow-hidden shadow-xl border border-gray-100 group active:scale-[0.98] transition-all"
          onclick="location.href='test-origins.html'">

          <div
            class="absolute -right-10 top-0 w-60 h-full pointer-events-none opacity-20 group-hover:opacity-60 transition-opacity">
            <script src="https://unpkg.com/@lottiefiles/dotlottie-wc@0.9.10/dist/dotlottie-wc.js"
              type="module"></script>

            <dotlottie-wc src="https://lottie.host/c167523b-b855-4369-914d-d867dbc98525/xLBP0MiVTT.lottie"
              style="width: 300px;height: 300px" autoplay loop></dotlottie-wc>
          </div>

          <div class="relative z-10 space-y-6">
            <div
              class="w-14 h-14 bg-primary text-white rounded-2xl flex items-center justify-center shadow-lg shadow-primary/20">
              <span class="material-symbols-outlined text-3xl">history_edu</span>
            </div>
            <div>
              <h4 class="font-headline font-black text-3xl text-primary-dim mb-2">Test de Orígenes</h4>
              <p class="text-secondary font-medium text-sm max-w-[240px] leading-relaxed">
                Mide tus comportamientos reales y descubre tu ADN vocacional.
              </p>
            </div>
            <button
              class="bioluminescent-glow text-white font-black py-4 px-10 rounded-2xl text-xs uppercase tracking-[0.2em] shadow-2xl">
              Iniciar Experimento
            </button>
          </div>
        </div>

        <div
          class="bg-white p-6 rounded-[2rem] shadow-sm border-b-4 border-cluster-cientifico active:scale-95 transition-transform cursor-pointer group"
          onclick="location.href='career-bank.html'">
          <span
            class="material-symbols-outlined text-cluster-cientifico mb-4 text-3xl group-hover:scale-110 transition-transform">auto_stories</span>
          <h4 class="font-headline font-black text-primary-dim text-sm mb-1">Banco de Carreras</h4>
          <p class="text-secondary text-[10px] font-bold uppercase tracking-tighter opacity-60">Explora tu cluster</p>
        </div>

        <div
          class="bg-white p-6 rounded-[2rem] shadow-sm border-b-4 border-cluster-tecnico active:scale-95 transition-transform cursor-pointer group">
          <span
            class="material-symbols-outlined text-cluster-tecnico mb-4 text-3xl group-hover:rotate-12 transition-transform">experiment</span>
          <h4 class="font-headline font-black text-primary-dim text-sm mb-1">Protocolo Diario</h4>
          <p class="text-secondary text-[10px] font-bold uppercase tracking-tighter opacity-60">Mantén tu racha</p>
        </div>
      </div>
    </section>

  </main>

  <nav
    class="fixed bottom-0 left-0 w-full h-24 bg-white/90 backdrop-blur-xl border-t border-gray-100 flex justify-around items-center px-6 z-50">
    <button onclick="location.href='index.html'"
      class="bg-primary-container text-primary w-12 h-12 rounded-2xl flex items-center justify-center shadow-sm transition-all">
      <span class="material-symbols-outlined text-2xl"
        style="font-variation-settings: 'FILL' 1, 'wght' 700;">home</span>
    </button>
    <button onclick="location.href='career-bank.html'"
      class="flex items-center justify-center w-12 h-12 text-[#acadac] hover:text-primary transition-colors">
      <span class="material-symbols-outlined text-2xl">auto_stories</span>
    </button>
    <button onclick="location.href='labs.html'"
      class="bioluminescent-glow text-white w-16 h-16 rounded-full -mt-12 border-[6px] border-[#f8faf9] flex items-center justify-center shadow-2xl transition-transform active:scale-90">
      <span class="material-symbols-outlined text-white text-3xl">science</span>
    </button>
    <button onclick="location.href='profile.html'"
      class="flex items-center justify-center w-12 h-12 text-[#acadac] hover:text-primary transition-colors">
      <span class="material-symbols-outlined text-2xl">person</span>
    </button>
    <button onclick="location.href='why-us.html'"
      class="flex items-center justify-center w-12 h-12 text-[#acadac] hover:text-primary transition-colors">
      <span class="material-symbols-outlined text-2xl">info</span>
    </button>
  </nav>

  <script type="module" src="js/pages/dashboard.js"></script>
</body>

</html>
