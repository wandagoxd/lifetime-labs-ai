<!DOCTYPE html>
<html class="light" lang="es">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>Lifetime Labs | Login</title>

  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Plus+Jakarta+Sans:wght@400;600&display=swap"
    rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1"
    rel="stylesheet" />

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            "primary": "#006947",
            "primary-container": "#a0f7ca",
            "secondary": "#5d5c4d",
            "on-surface": "#2d2f2e",
            "on-surface-variant": "#5a5c5b",
            "surface-container-low": "#f0f1ef"
          },
          fontFamily: { "headline": ["Manrope"], "body": ["Plus Jakarta Sans"] }
        }
      }
    }
  </script>

  <style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }

    .bioluminescent-glow {
      background: linear-gradient(145deg, #006947 0%, #005c3d 100%);
      box-shadow: 0 8px 24px rgba(162, 249, 204, 0.2);
    }

    body {
      background-color: #FFFFFD;
      min-height: 100vh;
    }

    .coreon-float {
      filter: drop-shadow(0 12px 32px rgba(45, 47, 46, 0.06));
    }
  </style>
</head>

<body class="font-body text-on-surface flex flex-col items-center justify-center p-6">

  <main class="w-full max-w-md space-y-12">

    <header class="flex flex-col items-center text-center space-y-4">
      <div
        class="relative w-32 h-32 bg-surface-container-low rounded-full flex items-center justify-center p-4 coreon-float">
        <img src="/assets/Coreon.svg" class="w-full h-full object-contain" alt="Coreon Mascot" />
        <div class="absolute -bottom-1 -right-1 bg-primary-container p-2 rounded-full shadow-sm">
          <span class="material-symbols-outlined text-primary text-xs"
            style="font-variation-settings: 'FILL' 1;">eco</span>
        </div>
      </div>
      <div>
        <h1 class="font-headline font-extrabold text-3xl text-primary tracking-tight">Lifetime Labs</h1>
        <p class="text-[10px] font-bold uppercase tracking-[0.2em] opacity-60">The lab for your potential</p>
      </div>
    </header>

    <section class="space-y-8">
      <div class="text-center">
        <h2 class="font-headline font-bold text-2xl">Bienvenido de nuevo</h2>
        <p class="text-on-surface-variant text-sm">Continúa tu viaje en el laboratorio.</p>
      </div>

      <form class="space-y-4" action="index.html">
        <div class="space-y-2">
          <label class="text-[10px] font-bold uppercase tracking-wider text-secondary px-1">Email</label>
          <input type="email" placeholder="hola@lifetimelabs.io"
            class="w-full bg-surface-container-low border-none rounded-2xl px-5 py-4 focus:ring-2 focus:ring-primary-container transition-all" />
        </div>

        <div class="space-y-2">
          <div class="flex justify-between px-1">
            <label class="text-[10px] font-bold uppercase tracking-wider text-secondary">Contraseña</label>
            <a href="forgot.html" class="text-[10px] font-bold uppercase text-primary">¿Olvidaste tu contraseña?</a>
          </div>
          <div class="relative">
            <input type="password" placeholder="••••••••"
              class="w-full bg-surface-container-low border-none rounded-2xl px-5 py-4 focus:ring-2 focus:ring-primary-container transition-all" />
            <button type="button"
              class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 material-symbols-outlined">visibility</button>
          </div>
        </div>

        <button type="submit"
          class="w-full bioluminescent-glow py-4 rounded-full font-headline font-bold text-primary-container mt-4 active:scale-95 transition-transform flex items-center justify-center gap-2">
          <span>Entrar</span>
          <span class="material-symbols-outlined text-lg">arrow_forward</span>
        </button>
      </form>
    </section>

    <footer class="text-center space-y-6">
      <div class="flex items-center gap-4 text-[10px] font-bold uppercase text-gray-300">
        <div class="h-px flex-1 bg-gray-100"></div>
        <span>O continúa con</span>
        <div class="h-px flex-1 bg-gray-100"></div>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <button
          class="flex items-center justify-center gap-2 py-3 bg-white border border-gray-100 rounded-2xl text-sm font-semibold shadow-sm active:scale-95 transition-transform">
          <img src="/assets/google-icon.png" class="w-5 h-5" alt="Google">
          <span>Google</span>
        </button>
        <button
          class="flex items-center justify-center gap-2 py-3 bg-white border border-gray-100 rounded-2xl text-sm font-semibold shadow-sm active:scale-95 transition-transform">
          <span class="material-symbols-outlined text-xl" style="font-variation-settings: 'FILL' 1;">apple</span>
          <span>Apple</span>
        </button>
      </div>

      <p class="text-sm">
        ¿Aún no tienes cuenta?
        <a href="signup.html"
          class="text-primary font-bold underline decoration-primary-container decoration-2 underline-offset-4">Regístrate
          aquí</a>
      </p>
    </footer>

  </main>

  <div class="mt-auto pt-12 opacity-30 flex items-center gap-2">
    <span class="material-symbols-outlined text-sm">verified_user</span>
    <span class="text-[9px] font-bold uppercase tracking-[0.2em]">End-to-End Encrypted Lab</span>
  </div>

</body>

</html>
