<!DOCTYPE html>
<html class="light" lang="es">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Lifetime Labs | Test de Origenes</title>

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1"
        rel="stylesheet" />
    <link href="/css/unified-layout.css" rel="stylesheet" />

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        "primary": "#006947",
                        "primary-container": "#a0f7ca",
                        "on-surface": "#2d2f2e",
                        "on-surface-variant": "#5a5c5b",
                        "surface-container-low": "#f0f1ef"
                    },
                    fontFamily: { "headline": ["Manrope"], "body": ["Plus Jakarta Sans"] }
                }
            }
        }
    </script>

    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        .bioluminescent-glow {
            background: linear-gradient(145deg, #006947 0%, #005c3d 100%);
            box-shadow: 0 4px 20px -5px rgba(0, 105, 71, 0.4);
        }

        body {
            background-color: #FFFFFD;
            min-height: 100vh;
        }

        .fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

<body class="font-body text-on-surface antialiased px-6">
    <main id="app-container" class="ll-main-shell max-w-2xl mx-auto space-y-10 pb-10">
    </main>

    <script type="module" src="js/pages/main-origins.js"></script>
</body>

</html>
